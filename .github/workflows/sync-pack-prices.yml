name: Validate HardToCrack pack prices

on:
  pull_request:
    paths:
      - 'data/pack-prices.json'
      - 'scripts/check-pack-prices.mjs'
      - 'index.html'
      - 'precios/**'
      - 'guia/**'
      - 'pedidos/**'
      - 'en/**'
      - 'nl/**'
      - 'pt/**'
      - '.github/workflows/sync-pack-prices.yml'
  push:
    branches: [main]
    paths:
      - 'data/pack-prices.json'
      - 'scripts/check-pack-prices.mjs'
      - 'index.html'
      - 'precios/**'
      - 'guia/**'
      - 'pedidos/**'
      - 'en/**'
      - 'nl/**'
      - 'pt/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure prices and offers are consistent in ES EN NL PT
        run: node scripts/check-pack-prices.mjs
