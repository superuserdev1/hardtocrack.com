<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Gestión de pedidos · HardToCrack</title><link rel="stylesheet" href="/admin.css"><script defer src="/admin.js"></script></head><body><main><h1>HardToCrack · Gestión de pedidos</h1><p>Acceso interno. La credencial se conserva solo mientras esta página está abierta.</p><form id="login"><label>Credencial interna<input type="password" id="token" required autocomplete="off"></label><button>Entrar / actualizar</button><button type="button" id="logout">Salir</button></form><p id="status" role="status" aria-live="polite"></p><section id="workspace" hidden><h2>Tiendas</h2><form id="store"><label>Referencia<input name="ref" placeholder="HTC-MAD-001" required pattern="HTC-[A-Z]{3}-[0-9]{3}"></label><label>Nombre de tienda<input name="name" required maxlength="120"></label><label>Email de referencia<input name="email" type="email" required></label><label>Email de acuses y seguimiento (vacío = mismo email)<input name="receipt_email" type="email"></label><label><input name="active" type="checkbox" checked> Tienda activa</label><label><input name="rotate_code" type="checkbox"> Generar un nuevo código (revoca el anterior)</label><button>Guardar tienda</button></form><pre id="code" hidden></pre><div id="stores"></div><h2>Últimas solicitudes</h2><button type="button" id="refresh">Actualizar lista</button><button type="button" id="drain">Procesar correos pendientes</button><div id="mail"></div><div id="orders"></div></section></main></body></html>
